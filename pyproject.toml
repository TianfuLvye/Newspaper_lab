[project]
name = "fishnet-reference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "trafilatura>=2.2.0",
    "pillow>=11.0.0",
    "yt-dlp>=2025.3.31",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "newspaper-layout",
    "mistune>=3.3.4",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
newspaper-layout = { git = "https://github.com/TianfuLvye/newspaper-layout.git", subdirectory = "newspaper_layout_v0_4_continuation" }
