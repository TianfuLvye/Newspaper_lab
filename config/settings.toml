# Fishnet 全局配置(Lab 1+)

[dailyhot]
# 自部署 DailyHotApi 基址。勿依赖公共实例——它随时会挂。
base_url = "http://127.0.0.1:6688"
timeout_seconds = 20

[rsshub]
# Lab 3:自部署 RSSHub(见仓库根目录 docker-compose.yml)。
# Docker 网络内其它容器可用 http://rsshub:1200;本机 CLI 用 127.0.0.1。
base_url = "http://127.0.0.1:1200"

[paths]
db = "data/fishnet.db"
render_dir = "render/sections"
editions_dir = "data/editions"

[scheduler]
# Lab 6:常驻调度。时区只影响 cron 出报,采集 interval 用墙上时钟分钟。
timezone = "Asia/Shanghai"
jitter_seconds = 120          # 打散整点齐发,避免像一次小型 DDoS
enrich_interval_hours = 6
enrich_limit = 40
am_hour = 7
am_minute = 0
pm_hour = 18
pm_minute = 0

[mediacrawler]
# Lab 4:MediaCrawler 仓库路径(独立进程,不 import 进 Fishnet)。
# git clone --depth 1 https://github.com/NanmiCoder/MediaCrawler third_party/MediaCrawler
home = "third_party/MediaCrawler"

[ranking]
# Lab 7:粗排 Top N 才跑评委;每期 LLM 调用硬顶。
coarse_k = 150
headline_n = 3
deepread_n = 8
critical_n = 3
explore_ratio = 0.15

[extract]
# Lab 5:正文抽取。同一 URL 24h 内不重复请求;同域名至少间隔 delay_seconds。
cache_dir = "data/html_cache"
cache_ttl_hours = 24
delay_seconds = 1.5
min_chars = 200
# 公众号 / 知乎 robots 对 * 往往 Disallow:/。个人订阅只放行单篇:
# 微信 /s、专栏 /p/、回答 /question/.../answer/...。不扩到搜索、热榜问题页。
robots_override_hosts = ["mp.weixin.qq.com", "zhuanlan.zhihu.com", "www.zhihu.com"]
