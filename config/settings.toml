# Fishnet 全局配置(Lab 1+)

[dailyhot]
# 自部署 DailyHotApi 基址。勿依赖公共实例——它随时会挂。
base_url = "http://127.0.0.1:6688"
timeout_seconds = 20

[rsshub]
# Lab 3:自部署 RSSHub(见仓库根目录 docker-compose.yml)。
# Docker 网络内其它容器可用 http://rsshub:1200;本机 CLI 用 127.0.0.1。
base_url = "http://127.0.0.1:1200"

[paths]
db = "data/fishnet.db"
render_dir = "render/sections"

[mediacrawler]
# Lab 4:MediaCrawler 仓库路径(独立进程,不 import 进 Fishnet)。
# git clone --depth 1 https://github.com/NanmiCoder/MediaCrawler third_party/MediaCrawler
home = "third_party/MediaCrawler"
