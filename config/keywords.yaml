# Lab 2 关键词 DSL。exclude 词表请持续积累——它对报纸质量的贡献超乎想象。
# 覆盖:财经(自选股/宏观)、政治经济、AI/科技。
groups:
  - name: 自选股-宁德时代
    must: ["宁德时代"]
    any: ["财报", "定增", "订单", "产能", "调研", "机构", "电池"]
    exclude: ["股吧", "荐股", "牛股", "涨停板揭秘", "内幕"]
    weight: 3.0
    sections: [finance]
    aliases:
      宁德时代: ["宁王", "CATL"]

  - name: 宏观经济
    any: ["央行", "LPR", "降准", "降息", "PMI", "CPI", "财政政策", "国常会", "专项债"]
    exclude: ["预测神准", "算命", "必看", "稳赚"]
    weight: 2.5
    sections: [finance, policy]

  - name: 政治经济观察
    any: ["关税", "制裁", "供应链", "制造业回流", "出口管制", "产业政策", "国企改革"]
    exclude: ["爱国营销", "带货", "割韭菜"]
    weight: 2.2
    sections: [policy, finance]
    aliases:
      出口管制: ["实体清单", "entity list"]

  - name: AI 进展
    any: ["大模型", "OpenAI", "Anthropic", "推理模型", "开源模型", "AI"]
    exclude: ["割韭菜", "培训班", "变现", "副业", "教程分享", "日入"]
    weight: 2.0
    sections: [tech]
    aliases:
      AI: ["人工智能", "artificial intelligence"]
      大模型: ["LLM", "foundation model"]

  - name: 机器人与具身智能
    any: ["宇树", "人形机器人", "四足机器人", "具身智能"]
    exclude: ["概念股", "涨停", "龙头股揭秘"]
    weight: 2.0
    sections: [tech]
    aliases:
      宇树: ["Unitree", "宇树科技"]

  - name: 半导体
    any: ["芯片", "光刻", "先进制程", "HBM", "EDA", "半导体"]
    exclude: ["荐股", "内幕消息", "必涨"]
    weight: 2.0
    sections: [tech, finance]
    aliases:
      芯片: ["chip", "集成电路"]
