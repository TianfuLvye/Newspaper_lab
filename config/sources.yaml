# Lab 1:声明要开的热榜网。board = DailyHotApi 路径名,source = Item.Source 枚举值。
# 说明:weibo 上游常间歇 500,多挂 thepaper 保证「至少 5 平台」验收门槛仍可达成。
# source 用细粒度平台名(toutiao/thepaper),便于版面溯源;勿再统一标成 news。
hotlists:
  - {board: weibo, source: weibo}
  - {board: zhihu, source: zhihu}
  - {board: bilibili, source: bilibili}
  - {board: douyin, source: douyin}
  - {board: toutiao, source: toutiao}
  - {board: thepaper, source: thepaper}

# Lab 3:RSS / RSSHub 订阅清单。
# url 里可用 {rsshub} 占位,运行时替换为 settings.toml 的 [rsshub].base_url。
# 验收要求 ≥10 源;下列以用户指定账号为核心,再补新番 / 财经 / 知乎日报早报等稳定源。
#
# 用户指定:
#   - 知乎 Thoughts Memo  L.M.Sherlock
#   - 知乎 差评君          chai-ping-jun-80 (机构号 /org/)
#   - 知乎日报             zhi-hu-ri-bao-51-41 (机构号,只收「| 早报 YYYYMMDD」)
#   - B站 泛式             63231
#   - B站 好柿花生_Peanut  435128088(用户口述「甜柿花生」)
#   - 华尔街日报           官方 DJ RSS(RSSHub /wsj/zh-cn 现常 503)
# 知乎周刊已停更,不再订阅。热榜问题不在这里扒回答,点名后再拉。
feeds:
  # —— 知乎 ——
  - name: "Thoughts Memo 动态"
    url: "{rsshub}/zhihu/people/activities/L.M.Sherlock"
    source: zhihu
    kind: article
    weight: 2.0
  - name: "Thoughts Memo 回答"
    url: "{rsshub}/zhihu/people/answers/L.M.Sherlock"
    source: zhihu
    kind: article
    weight: 2.0
  - name: "差评君 动态"
    url: "{rsshub}/zhihu/people/activities/chai-ping-jun-80"
    source: zhihu
    kind: article
    weight: 1.8
  - name: "差评君 回答"
    url: "{rsshub}/zhihu/people/answers/chai-ping-jun-80"
    source: zhihu
    kind: article
    weight: 1.8
  - name: "知乎日报 早报"
    url: "{rsshub}/zhihu/posts/org/zhi-hu-ri-bao-51-41"
    source: zhihu
    kind: article
    weight: 1.6
    # 只要早报。标题用全角「｜早报 YYYYMMDD」;过长标题会被 RSSHub 截断,
    # 此时用正文开头「嘿，这里是知乎早报」兜底。瞎扯等帖不含「早报」。
    title_regex: 早报

  # —— B 站指定 UP + 新番 ——
  - name: "泛式 投稿"
    url: "{rsshub}/bilibili/user/video/63231"
    source: bilibili
    kind: video
    weight: 2.0
  - name: "泛式 动态"
    url: "{rsshub}/bilibili/user/dynamic/63231"
    source: bilibili
    kind: post
    weight: 1.5
  - name: "好柿花生 投稿"
    url: "{rsshub}/bilibili/user/video/435128088"
    source: bilibili
    kind: video
    weight: 2.0
  - name: "好柿花生 动态"
    url: "{rsshub}/bilibili/user/dynamic/435128088"
    source: bilibili
    kind: post
    weight: 1.5
  # 不订「B站每周必看」:一条榜能吐几十条与个人订阅无关的视频,
  # 会把报纸订阅版面挤满。新番用下面 Bangumi 日历即可。
  # 注意路由带点号 bangumi.tv(不是 bangumi/tv)
  - name: "Bangumi 今日放送"
    url: "{rsshub}/bangumi.tv/calendar/today"
    source: bilibili
    kind: video
    weight: 1.5

  # —— 华尔街日报 / 财经 ——
  # RSSHub /wsj/zh-cn 目前对 cn.wsj.com 常 503(站点结构/反爬);
  # 先用道琼斯官方英文 RSS 保底,另挂华尔街见闻作中文财经旁路。
  - name: "华尔街日报 世界新闻"
    url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"
    source: finance
    kind: article
    weight: 2.5
  - name: "华尔街日报 市场"
    url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"
    source: finance
    kind: article
    weight: 2.3
  - name: "华尔街日报 科技"
    url: "https://feeds.a.dj.com/rss/RSSWSJD.xml"
    source: finance
    kind: article
    weight: 2.2
  - name: "华尔街见闻 全球"
    url: "{rsshub}/wallstreetcn/news/global"
    source: finance
    kind: article
    weight: 2.0

# Lab 4:定向采集。默认不随 `collect` 全量跑(Playwright 太重)。
# 只覆盖 RSSHub 做不到的平台:小红书 / 抖音创作者主页。
# 跑: uv run main.py collect --only-targeted
# 直播抓取需要本机扫码登录 MediaCrawler;测试用 jsonl fixture,不碰浏览器。
targeted:
  - name: "小红书示例创作者"
    platform: xhs
    # 填 24 位 user_id,或带 xsec_token 的主页 URL。空则 collect 时明确报错。
    creator_id: ""
    source: xiaohongshu
    kind: post
    max_notes: 10
